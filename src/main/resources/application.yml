spring:
  application:
    name: payment-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      fail-fast: false
      retry:
        max-attempts: 6
        initial-interval: 1500
        multiplier: 1.5
        max-interval: 3000
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/paymentservicedb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:Mysql@2022}
    hikari:
      maximum-pool-size: 20
      connection-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: always
  # OAuth2 resource server. Access tokens are minted by authentication-service
  # (social / password login) and signed RS256; we verify them locally against its
  # published JWK set, so no network call to the auth service is needed per request.
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWKS_URI:http://localhost:8081/.well-known/jwks.json}
          issuer-uri: ${JWT_ISSUER:https://auth.paymentprocessor.local}
  profiles:
    active: local

server:
  port: ${SERVER_PORT:8087}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# Outbound integrations. Point these at the real gateway / PSP / fraud / vault
# base URLs and inject credentials via environment variables in each environment.
payment:
  card:
    base-url: ${CARD_BASE_URL:http://localhost:9101}
    api-key: ${CARD_API_KEY:}
    connect-timeout-ms: 2000
    read-timeout-ms: 5000
    max-retries: 2
    enabled: true
  upi:
    base-url: ${UPI_BASE_URL:http://localhost:9102}
    api-key: ${UPI_API_KEY:}
    connect-timeout-ms: 2000
    read-timeout-ms: 8000
    max-retries: 1
    enabled: true
    payee-vpa: ${UPI_PAYEE_VPA:acme@psp}
    payee-name: ${UPI_PAYEE_NAME:Acme Payments}
    collect-expiry-seconds: 300
  fraud:
    base-url: ${FRAUD_SERVICE_URL:http://localhost:8088}
    api-key: ${FRAUD_API_KEY:}
    connect-timeout-ms: 1000
    read-timeout-ms: 2000
    max-retries: 1
    enabled: ${FRAUD_ENABLED:true}
  vault:
    base-url: ${TOKENIZATION_SERVICE_URL:http://localhost:8084}
    api-key: ${VAULT_API_KEY:}
    connect-timeout-ms: 1000
    read-timeout-ms: 2000
    max-retries: 1
    enabled: ${VAULT_ENABLED:true}
  limit:
    base-url: ${LIMIT_SERVICE_URL:http://localhost:8085}
    api-key: ${LIMIT_API_KEY:}
    connect-timeout-ms: 1000
    read-timeout-ms: 5000
    max-retries: 1
    enabled: ${LIMIT_ENABLED:true}
  outbox:
    sink-url: ${OUTBOX_SINK_URL:}
    batch-size: 100

# Authorization holds expire after this many seconds unless captured.
authorization:
  expiry:
    card-seconds: ${CARD_AUTH_EXPIRY:604800}
    upi-seconds: ${UPI_AUTH_EXPIRY:300}

# Toggle: lets local/dev runs and the seeded sample data be exercised without a token.
security:
  jwt:
    enabled: ${SECURITY_JWT_ENABLED:true}

---
# Local/dev profile document. Running the service against the seeded sample data
# (data.sql) with plain curl means there is no authentication-service handy to mint
# tokens, so JWT enforcement is turned off here. Never activated in production.
spring:
  config:
    activate:
      on-profile: local

security:
  jwt:
    enabled: false
