# HashiCorp Vault (dev mode) for local secret management
#
#   docker compose -f docker/vault/docker-compose.vault.yml up -d
#   # or from root: docker compose --profile vault up -d
#
# UI/API: http://localhost:8200
# Root token (dev only): root

services:
  vault:
    image: hashicorp/vault:1.17.5
    container_name: paymentprocessor-vault
    profiles: ["vault"]
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  vault-init:
    image: hashicorp/vault:1.17.5
    container_name: paymentprocessor-vault-init
    profiles: ["vault"]
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
    volumes:
      - ./init-secrets.sh:/init-secrets.sh:ro
    entrypoint: ["/bin/sh", "/init-secrets.sh"]
    restart: "no"
