apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: payment-processor
  labels:
    app: vault
spec:
  selector:
    app: vault
  ports:
    - name: http
      port: 8200
      targetPort: 8200
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: payment-processor
  labels:
    app: vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      containers:
        - name: vault
          image: hashicorp/vault:1.17.5
          args: ["server", "-dev", "-dev-root-token-id=root", "-dev-listen-address=0.0.0.0:8200"]
          env:
            - name: VAULT_DEV_ROOT_TOKEN_ID
              value: root
            - name: VAULT_ADDR
              value: http://127.0.0.1:8200
          ports:
            - containerPort: 8200
              name: http
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]
          readinessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true&uninitcode=200&sealedcode=200
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
# Bootstrap Secret used only until Vault Agent / Spring Cloud Vault is wired.
# Replace with real Vault KV values in non-dev environments.
apiVersion: v1
kind: Secret
metadata:
  name: vault-root-token
  namespace: payment-processor
type: Opaque
stringData:
  token: root
