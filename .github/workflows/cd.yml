name: CD
run-name: Continous Deployment

# GitHub Actions → Docker → GHCR → update Helm values → Argo CD syncs Kubernetes
on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to publish (default = git SHA / tag)
        required: false
        type: string

concurrency:
  group: cd-payment-service
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  JAVA_VERSION: "21"

jobs:
  release:
    name: Build · Scan · Push · GitOps
    runs-on: ubuntu-latest
    if: "${{ github.event_name != 'push' || !contains(github.event.head_commit.message, 'chore(cd): bump') }}"
    permissions:
      contents: write
      packages: write
      security-events: write
      id-token: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew --no-daemon test

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image metadata
        id: meta
        run: |
          REPO_LC=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="${{ env.REGISTRY }}/${REPO_LC}"
          if [ -n "${{ inputs.image_tag }}" ]; then
            VERSION="${{ inputs.image_tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="sha-${GITHUB_SHA::7}"
          fi
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tags=${IMAGE}:${VERSION},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          echo "Resolved image ${IMAGE}:${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=payment-service

      - name: Trivy scan (pushed image)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Update Helm image tag (GitOps)
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: |
          chmod +x scripts/update-helm-image.sh
          ./scripts/update-helm-image.sh \
            "${{ steps.meta.outputs.image }}" \
            "${{ steps.meta.outputs.version }}"

      - name: Commit Helm values if changed
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: |
          if git diff --quiet helm/payment-service/values.yaml; then
            echo "Helm values already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/payment-service/values.yaml
          git commit -m "chore(cd): bump payment-service image to ${{ steps.meta.outputs.version }}"
          git push origin HEAD:main

      - name: Summary
        run: |
          echo "### payment-service published" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Helm values updated for Argo CD" >> "$GITHUB_STEP_SUMMARY"
